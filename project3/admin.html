<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FieldEngineer · Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Password overlay - Red theme */
        #passwordOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .password-box {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .password-box i {
            font-size: 3rem;
            color: #dc3545;
            margin-bottom: 1rem;
        }
        
        .password-box h3 {
            color: #8b0000;
            margin-bottom: 0.5rem;
        }
        
        .password-box p {
            color: #666;
            margin-bottom: 1.5rem;
        }
        
        .password-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
        }
        
        .password-box input:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
        }
        
        .password-box .btn-primary {
            width: 100%;
            justify-content: center;
        }
        
        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            display: none;
            margin-bottom: 1rem;
        }
        
        .error-msg.show {
            display: block;
        }
        
        #adminContent {
            display: none;
        }
        
        #adminContent.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Password Overlay -->
    <div id="passwordOverlay">
        <div class="password-box">
            <i class="fas fa-lock"></i>
            <h3>Admin Access</h3>
            <p>Enter password to view bookings</p>
            <input type="password" id="passwordInput" placeholder="Enter password..." />
            <div class="error-msg" id="errorMsg">Incorrect password!</div>
            <button class="btn-primary" id="unlockBtn">
                <i class="fas fa-unlock"></i> Unlock Dashboard
            </button>
        </div>
    </div>

    <!-- Admin Content -->
    <div id="adminContent">
        <div class="container">
            <!-- Header -->
            <header class="header">
                <div class="logo">
                    <i class="fas fa-microchip"></i>
                    <h1>Field<span>Engineer</span></h1>
                </div>
                <div class="header-right">
                    <span><i class="fas fa-calendar-alt"></i> <span id="dateDisplay"></span></span>
                    <span><i class="fas fa-ticket-alt"></i> <span id="todayBookingsAdmin">0</span>/30 today</span>
                    <a href="index.html" class="admin-btn"><i class="fas fa-arrow-left"></i> Back</a>
                    <button onclick="logoutAdmin()" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </header>

            <!-- Dashboard -->
            <section class="dashboard-section">
                <div class="dashboard-header">
                    <h2><i class="fas fa-table"></i> Bookings Dashboard</h2>
                    <span class="record-count"><i class="fas fa-database"></i> <span id="bookingCount">0</span> records</span>
                </div>

                <!-- Stats -->
                <div class="stats">
                    <div class="stat-item">
                        <i class="fas fa-wifi"></i>
                        <span>Dedicated: <strong id="countDedicated">0</strong></span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-phone"></i>
                        <span>ISDN: <strong id="countIsdn">0</strong></span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-lock"></i>
                        <span>VPN: <strong id="countVpn">0</strong></span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-calendar-check"></i>
                        <span>Total: <strong id="totalBookings">0</strong></span>
                    </div>
                    <div class="stat-item" style="color:#dc3545;">
                        <i class="fas fa-ticket-alt"></i>
                        <span>Today: <strong id="todayCount">0</strong>/30</span>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Service</th>
                                <th>Description</th>
                                <th>Company</th>
                                <th>Location</th>
                                <th>Phone</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th style="text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr class="empty-row">
                                <td colspan="8">No bookings yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <footer class="footer">
                <p><i class="fas fa-trash-alt"></i> Click <i class="fas fa-times-circle" style="color:#dc3545;"></i> to delete</p>
            </footer>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        // Password protection
        (function() {
            const PASSWORD = 'admin123';
            const overlay = document.getElementById('passwordOverlay');
            const content = document.getElementById('adminContent');
            const passwordInput = document.getElementById('passwordInput');
            const unlockBtn = document.getElementById('unlockBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (sessionStorage.getItem('adminAuth') === 'true') {
                overlay.style.display = 'none';
                content.classList.add('show');
            }

            function unlock() {
                if (passwordInput.value === PASSWORD) {
                    sessionStorage.setItem('adminAuth', 'true');
                    overlay.style.display = 'none';
                    content.classList.add('show');
                    errorMsg.classList.remove('show');
                } else {
                    errorMsg.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            unlockBtn.addEventListener('click', unlock);
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') unlock();
            });

            window.logoutAdmin = function() {
                sessionStorage.removeItem('adminAuth');
                overlay.style.display = 'flex';
                content.classList.remove('show');
                passwordInput.value = '';
                errorMsg.classList.remove('show');
                passwordInput.focus();
            };
        })();
    </script>
</body>
</html>
