<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FieldEngineer · Book a Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-microchip"></i>
                <h1>Field<span>Engineer</span></h1>
            </div>
            <div class="header-right">
                <span><i class="fas fa-calendar-alt"></i> <span id="dateDisplay"></span></span>
                <span><i class="fas fa-ticket-alt"></i> <span id="todayBookings">0</span>/30 today</span>
                <a href="admin.html" class="admin-btn"><i class="fas fa-user-cog"></i> Admin</a>
            </div>
        </header>

        <!-- Booking Form -->
        <section class="booking-section">
            <h2><i class="fas fa-pen-to-square"></i> Book a Service</h2>
            
            <form id="bookingForm">
                <!-- Row 1: Service & Description -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-globe"></i> Service Type</label>
                        <select id="serviceType" required>
                            <option value="Dedicated Internet">Dedicated Internet</option>
                            <option value="ISDN Service">ISDN Service</option>
                            <option value="VPN Service">VPN Service</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label><i class="fas fa-file-alt"></i> Issue Description</label>
                        <textarea id="issueDescription" rows="3" placeholder="Please describe the issue in detail. Include any error messages, when the problem started, and what troubleshooting you've already tried..." required></textarea>
                    </div>
                </div>

                <!-- Row 2: Company & Location -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-building"></i> Company Name</label>
                        <input type="text" id="companyName" placeholder="Enter company name" required />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-map-pin"></i> Location</label>
                        <input type="text" id="clientLocation" placeholder="City, address" required />
                    </div>
                </div>

                <!-- Row 3: Phone & Date -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="tel" id="phoneNumber" placeholder="+233 24 123 4567" required />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar-day"></i> Booking Date</label>
                        <input type="date" id="bookingDate" required />
                    </div>
                </div>

                <!-- Row 4: Time & Submit -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> Available Time</label>
                        <input type="time" id="bookingTime" required />
                    </div>
                    <div class="form-group submit-group">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-plus-circle"></i> Create Booking
                        </button>
                    </div>
                </div>

                <div class="form-hint">
                    <i class="fas fa-info-circle"></i> All fields are required | Maximum 30 bookings per day
                </div>
            </form>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p><i class="fas fa-database"></i> All data stored locally</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
